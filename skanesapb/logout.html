<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>SKANESA PANCUR BATU - Sesi Berakhir</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_blank', '');
            window.close();
            return false;
        }
    </script>
</head>

<body>
    <div class="main">
        <div class="wrap">
            <div class="brand-logo-container">
                <img src="img/logo.png" alt="Logo SMKN 1 Pancur Batu" class="brand-logo" />
            </div>
            <div class="brand-title">SKANESA <span>PANCUR BATU</span></div>
            <div class="brand-subtitle">Sesi Berakhir</div>

            <p class="info" style="margin-bottom: 15px;">Anda telah terputus dari jaringan.</p>

            <table>
                <tr><td>Username</td><td>$(username)</td></tr>
                <tr><td>IP Address</td><td>$(ip)</td></tr>
                <tr><td>MAC Address</td><td>$(mac)</td></tr>
                <tr><td>Total Durasi</td><td>$(uptime)</td></tr>
                $(if session-time-left)
                    <tr><td>Sisa Waktu</td><td>$(session-time-left)</td></tr>
                $(endif)
                <tr><td>Upload / Download</td><td>$(bytes-in-nice) / $(bytes-out-nice)</td></tr>
            </table>

            <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                <input type="submit" value="Login Kembali">
            </form>

            <a href="beli.html" target="_blank" class="btn-buy">
                🛒 Voucher Online
            </a>
        </div>
    </div>
</body>

</html>
